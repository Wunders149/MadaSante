services:
  - type: web
    name: madasante
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    # SQLite DB lives under server/data (ephemeral on Render).
    # A super admin is bootstrapped on start from ADMIN_EMAIL / ADMIN_PASSWORD.