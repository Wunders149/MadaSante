services:
  - type: web
    name: madasante
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PG_SSL
        value: "true"
    # Database is hosted on Supabase Postgres (DATABASE_URL).
    # Schema is created on boot by migrate(); a super admin is
    # bootstrapped from ADMIN_EMAIL / ADMIN_PASSWORD.
    #
    # JWT_SECRET must be set in the dashboard: the server refuses to start in
    # production without it. CORS_ORIGINS is only needed if a separate
    # frontend host is used (the API serves the SPA itself by default).