services:
  - type: web
    name: madasante
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PG_SSL
        value: "true"
    # Database is hosted on Supabase Postgres (DATABASE_URL).
    # Schema is created on boot by migrate(); a super admin is
    # bootstrapped from ADMIN_EMAIL / ADMIN_PASSWORD.